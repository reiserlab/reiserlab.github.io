# Site-wide settings. Edit freely; the build reads this on every run.
title: Reiser Lab
domain: reiserlab.org
# Set to true only after the Cloudflare DNS records point at GitHub Pages (see docs/plan.md section 2).
domain_live: false
tagline: We study how vision works, from single neurons processing light to brain-wide circuits that transform what a fly sees into what it does.
institution: Janelia Research Campus, Howard Hughes Medical Institute
address: 19700 Helix Drive, Ashburn, Virginia 20147, USA
email: reiserm@janelia.hhmi.org

# Appears as a line under the lab name on the home page.
pillars:
  - key: anatomy
    name: Anatomy
    line: Connectomes and cell types of the fly visual system.
  - key: behavior
    name: Behavior
    line: Flight and walking in virtual worlds.
  - key: neurophysiology
    name: Neurophysiology
    line: Recording neurons while the fly sees.
  - key: methods
    name: Methods
    line: Instruments, displays and software we build and share.
modeling_line: The fly visual system offers a rare combination of richness and tractability. It supports many behaviors, yet its wiring is now completely mapped, so we can ask how real behaviors arise from specific computations in identified neurons.
focus_line: We combine connectomics, quantitative behavior, neurophysiology and modeling, and we build the instruments each of these needs. We share the tools and data we make.

# Home-page hero: the question, and the two captions that appear as the animation plays.
hero:
  question: Where does behavior come from?
  lede: We study vision in flies to find out, from single neurons processing light to brain-wide circuits that turn what a fly sees into what it does.
  stops:
    - eyebrow: Why flies
      title: A complete visual system, completely mapped
      text: The fly visual system supports many behaviors, and every neuron and connection in it is now known. That combination lets us test long-standing ideas about how brains work.
    - eyebrow: Now
      title: From wiring diagrams to working circuits
      text: We are adding function to the map, and automating our experiments to do it at scale.

# Research themes on the home page. Each is a question, answered in two or three sentences.
# media: base name of a loop in mockups/media/ (mp4 + jpg poster). papers: ids from publications.yaml.
themes:
  - key: motion
    question: How do neurons compute the direction of motion?
    text: >
      Motion vision is our proving ground. Using whole-cell recordings from T4 and T5 neurons, the first
      direction-selective cells in the fly visual system, we built models that explain how these cells turn
      non-selective inputs into direction-selective signals. We are now mapping which receptors sit at which
      synapses, to learn what sets the timing this computation depends on.
    media: theme-motion
    media_caption: Inputs to a single T4 neuron, colored by cell type
    papers: [gruntman2018t4, gruntman2019t5, zhao2025eyemap]
  - key: wiring
    question: How is a visual system organized?
    text: >
      With the FlyEM team and many colleagues, we cataloged every cell type in the fly optic lobe from a
      complete wiring diagram, and traced how visual information travels from the eye into the central brain.
      The structure of the eye itself shapes what neurons deep in the brain respond to. These maps tell us
      which neurons to study next.
    media: theme-wiring
    media_caption: The 11,700 cell types of the male fly central nervous system. Video by Philip Hubbard, FlyEM
    papers: [nern2025inventory, hoeller2026pathways, berg2026malecns]
  - key: behavior
    question: How does vision guide behavior?
    text: >
      Vision is active, so no account of seeing is complete without behavior. We link identified neurons to
      what flies do, from pathways that detect the fly's own movement and steer walking to neurons that
      detect approaching objects. We are extending this approach to visual learning and to social behavior
      in complex environments.
    media: theme-behavior
    media_caption: A tethered fly steering in an LED arena
    papers: [isaacson2023lpc1, klapoetke2017looming, ofstad2011place]
  - key: scale
    question: Which neurons should we study next?
    text: >
      We can now explain individual circuits in mechanistic detail, but the fly brain has thousands of cell
      types. To study them at scale we are rebuilding our experimental approach: custom instruments for
      higher-throughput rigs, robots that handle flies, automated two-photon imaging, and adaptive experiments
      in which data from one experiment shape the next. The approach is human-centered and AI-accelerated.
    media: theme-scale
    media_caption: A tethered fly in a G6 LED arena
    papers: [isaacson2022g4, loesche2021treadmill]
    hiring: true

