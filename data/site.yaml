# Site-wide settings. Edit freely; the build reads this on every run.
title: Reiser Lab
description: The Reiser Lab at HHMI Janelia studies vision in flies to learn how brains turn seeing into doing, and shares the tools, maps and data it builds.
# Which design in mockups/variants.yaml the public site uses.
design: e
domain: reiserlab.org
# Set to true only after the Cloudflare DNS records point at GitHub Pages (see docs/plan.md section 2).
domain_live: true
tagline: We study how vision works, from single neurons processing light signals to brain-wide circuits that transform visual information into behavior.
institution: Janelia Research Campus, Howard Hughes Medical Institute
address: 19700 Helix Drive, Ashburn, Virginia 20147, USA
email: reiserm@janelia.hhmi.org
# Michael Reiser's full publication records, linked from the Publications page.
scholar: https://scholar.google.com/citations?user=yiU3lZcAAAAJ
orcid: https://orcid.org/0000-0002-4108-4517
# Visit counting: the GoatCounter account name (the part before .goatcounter.com). Leave empty to switch
# counting off. Clicks on links that leave the site are counted by mockups/shared/outbound.js.
goatcounter: mbreiser

# Appears as a line under the lab name on the home page.
pillars:
  - key: anatomy
    name: Anatomy
    line: Connectomes and cell types of the fly visual system.
  - key: behavior
    name: Behavior
    line: Flight and walking in virtual worlds.
  - key: neurophysiology
    name: Neurophysiology
    line: Recording neurons while the fly sees.
  - key: methods
    name: Methods
    line: Instruments, displays and software we build and share.
modeling_line: The fly visual system contains multiple interacting subsystems that support diverse behaviors, and its structure is now fully mapped. We use it to test long-standing theories of how brains work.
focus_line: Our work combines connectomics, quantitative behavior, neurophysiology and computational modeling. We build our own instruments and share them, along with our data and code.

# Home-page hero: the question, and the two captions that appear as the animation plays.
hero:
  question: How does a brain turn seeing into doing?
  lede: We study vision in flies to understand where behavior comes from.
  set: eyemap          # frame set in media/hero/: <set>-desktop and <set>-mobile
  frames: 180          # number of frames in each set
  scroll: 200vh        # height of the pinned section; 100vh of it is the screen itself
  credit: Animation by Marisa Dreher, from Zhao et al. 2025
  first_until: 0.18    # the question stays up for this fraction of the scroll
  # Captions that appear as the animation plays. from/to are scroll progress (0 to 1) and match the camera
  # rests listed in media/hero/README.md.
  stops:
    - eyebrow: Why flies
      title: A visual system with a complete wiring diagram
      text: Flies use vision for many behaviors, and every neuron and connection in the fly visual system has now been mapped.
      from: 0.28
      to: 0.52
    - eyebrow: Now
      title: What does each neuron do?
      text: We are measuring the activity of the mapped neurons during behavior, and automating our experiments so that we can study thousands of cell types.
      from: 0.68
      to: 0.97

# Research themes on the home page. Each is a question, answered in two or three sentences.
# media: base name of a loop in mockups/media/ (mp4 + jpg poster). papers: ids from publications.yaml.
themes:
  - key: motion
    question: How do neurons compute the direction of motion?
    text: >
      Motion vision is our proving ground. Using whole-cell recordings from T4 and T5 neurons, the first
      direction-selective cells in the fly visual system, we built models that explain how these cells turn
      non-selective inputs into direction-selective signals. We are now mapping which receptors sit at which
      synapses, to learn what sets the timing this computation depends on.
    media: theme-motion
    media_caption: Synaptic inputs to a single T4 neuron, colored by input cell type
    papers: [gruntman2018t4, gruntman2019t5, zhao2025eyemap]
  - key: wiring
    question: How is a visual system organized?
    text: >
      With the FlyEM team and many colleagues, we cataloged every cell type in the fly optic lobe from a
      complete wiring diagram, and traced how visual information travels from the eye into the central brain.
      We found that the structure of the eye shapes the responses of neurons deep in the brain. We use these
      maps to choose which neurons to study.
    media: theme-wiring
    media_caption: Dm4 neurons tiling the medulla. From Nern et al. 2025
    papers: [nern2025inventory, hoeller2026pathways, berg2026malecns]
  - key: behavior
    question: How does vision guide behavior?
    text: >
      Vision is inherently active, so no understanding of vision can be complete without behavior. We have
      identified neurons that detect the fly's own movement and steer walking, and neurons that detect
      approaching objects. We are extending this work to visual learning and to social behavior in complex
      environments.
    media: theme-behavior
    media_caption: A tethered fly steering in an LED arena
    papers: [isaacson2023lpc1, klapoetke2017looming, ofstad2011place]
  - key: scale
    question: Which neurons should we study next?
    text: >
      The fly brain has thousands of cell types, and the detailed methods we use to study one circuit at a
      time do not scale to all of them. We are rebuilding our experimental approach with custom instruments
      for higher-throughput rigs, robots that handle flies, automated two-photon imaging, and adaptive
      experiments in which data from one experiment shape the next. Our approach is human-centered and
      AI-accelerated.
    media: theme-scale
    media_caption: A robot places tethered flies on a ball in front of an LED display, one after another
    papers: [isaacson2022g4, loesche2021treadmill]
    hiring: true

