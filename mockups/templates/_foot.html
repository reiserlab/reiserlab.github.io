<footer class="foot" id="people-anchor">
  <div class="foot-cols">
    <div>
      <p class="foot-name">Reiser Lab</p>
      <p>{{ site.institution }}<br>{{ site.address }}</p>
    </div>
    <div>
      <p><a href="{{ site.links.github }}">GitHub</a><br><a href="{{ site.links.youtube }}">YouTube</a><br><a href="{{ site.links.janelia }}">Lab page at Janelia</a></p>
    </div>
    <div>
      <p>{{ site.hero.credit }}. Images and videos are from the lab's own work.</p>
      <p class="foot-built">Updated {{ built | month_year }}</p>
    </div>
  </div>
</footer>
{% if site.goatcounter and not mock %}
<!-- Visit counting with GoatCounter (no cookies). The account name is `goatcounter` in data/site.yaml. -->
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script defer src="{{ P.assets }}outbound.js"></script>
{% endif %}
