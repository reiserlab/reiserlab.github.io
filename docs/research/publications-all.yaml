# Complete publication list of Michael B. Reiser (ORCID 0000-0002-4108-4517, verified: record name "Michael Reiser",
# 36 works listed there; all are covered below except a meeting abstract and an eLife version DOI, see exclusions).
# Generated 2026-10-23 by script from these sources, in order:
#   1. PubMed E-utilities (esearch "Reiser MB[Author]" and "Reiser M[Author] AND (Drosophila OR fly OR vision OR Janelia OR
#      Caltech ...)"; efetch XML for title, authors, journal, dates, DOI, PMID, PMCID). 70 hits screened, 43 kept.
#   2. bioRxiv API (api.biorxiv.org/details) for every preprint DOI, including the "published" field used to set preprint_of.
#   3. Europe PMC (AUTH:"Reiser MB", indexes preprints), Crossref (query.author, prefix filters 10.1101 and 10.64898,
#      has-preprint relations, conference papers), the ORCID public API, and the Janelia lab page
#      https://www.janelia.org/lab/reiser-lab/publications (6 pages), and the arXiv API for the one arXiv preprint.
#   Google Scholar was not queried (no API; it would only have added citation counts).
#
# Total: 63 entries (35 journal, 5 review/commentary,
#   2 conference, 21 preprint). Sorted newest first by date.
# Field notes: `date` is the online publication date (PubMed ArticleDate, else Crossref published-online, else print date);
#   for preprints it is the date of the first bioRxiv version. `year` is the citation year (journal volume year), so a few
#   papers published online in December carry a `date` one year earlier than `year`. `type: review` is used for reviews, dispatches and
#   News & Views pieces. `pmid`/`pmcid` are omitted when none exists. `pillars` is left empty for the lab to tag.
#   The arXiv preprint has no DOI; its arXiv id is given under links.
#
# Excluded hits (not this M. Reiser, or not a publication), with reason:
#   Other people named M. Reiser found by the PubMed/Europe PMC/Crossref author searches (none has a fly/vision/Janelia
#   affiliation; all were dropped):
#     - Reiser MF / Reiser M, Maximilian F. Reiser, LMU Munich radiology (Eur Radiol, Radiologe, Rofo, Eur J Cardiothorac Surg,
#       Invest Radiol, Schizophr Res, Psychiatry Res, Biol Psychiatry, Genes Brain Behav, Brain, Hum Brain Mapp, PLoS One,
#       Neuropsychopharmacology, J Psychiatry Neurosci, Arch Gen Psychiatry, BMC Neurosci, Soc Cogn Affect Neurosci, Ann Rheum Dis,
#       Diagn Interv Radiol, J Glob Oncol, etc.; PMIDs 7740121, 8693089, 9830662, 10371110, 10756987, 10997443, 11793288, 15448906,
#       16476409, 17306512, 17765479, 18387137, 20799025, 20890763 and the Europe PMC-only psychiatry/radiology hits): radiology/psychiatry.
#     - Reiser M, Universitaet Ulm / Goethe University Frankfurt immunology (J Immunol 2009, 2011; Eur J Immunol 2014;
#       Methods Mol Biol 2015 "Minicircle"; Gene Ther 2021 "CARAMBA"; bioRxiv 10.1101/675009): immunology/CAR-T.
#     - Reiser ML, Boston University / DRK-Blutspendedienst (Front Immunol 2017, 2020, 2021; Sci Rep 2017): PorB adjuvant immunology.
#     - Reiser M, Univ. of South Florida (PNAS 2022 "Bioengineered peptibodies"), ACS Nano 2016 (nanoparticles), FASEB J 2003 and
#       Adv Exp Med Biol 2003 (Magdeburg/tumor MRI), Hemasphere 2026, Mol Pharm 2023, J Phys Chem B 2023, Environ Sci Pollut Res 2020,
#       Front Psychol 2016/2025 (Giessen sports science): unrelated fields.
#     - Martin Reiser, Univ. of Maryland accelerator physics (Phys Rev Lett, Nucl Instrum Methods, PAC proceedings 1969-2010);
#       Martin Reiser, IBM (J ACM 1980/81 queuing networks); Marion Reiser (political science chapters); Marius Reiser (theology);
#       Michelle Reiser (bioRxiv 10.1101/862441, 10.1101/2025.05.31.657128, 10.64898/2026.06.14.731898, 10.1101/2025.11.21.689807);
#       M. Reiser, pulse oximetry (bioRxiv 10.64898/2026.04.20.719559): unrelated.
#   Items by Michael B. Reiser or his lab that are deliberately not listed as separate entries:
#     - Dorkenwald S et al. 2024 Nature 10.1038/s41586-024-07558-y and Schlegel P et al. 2024 Nature 10.1038/s41586-024-07686-5:
#       Reiser appears only as a member of the FlyWire Consortium (PubMed investigator list), not as a named author.
#     - Seelig JD, Chiappe ME, Lott GK, Reiser MB, Jayaraman V. 2011 Biophys J 100(3) Suppl, 10.1016/j.bpj.2010.12.735, and
#       Longden K, Reiser M. 2017 J Vision 17(10):395, 10.1167/17.10.395: meeting abstracts (Biophysical Society, VSS).
#     - 10.1038/nmeth0211-184b (2011 corrigendum to Seelig et al. 2010), 10.2139/ssrn.3836132 (SSRN/Cell Press Sneak Peek copy of
#       Gruntman et al. 2021 preprint), 10.7554/eLife.90133.3 and 10.7554/eLife.93659.1 (eLife version DOIs), author-response
#       DOIs 10.7554/elife.*.sa2: duplicates of listed items.
#     - Reiser MB. 2007 PhD thesis, Caltech, "Visually mediated control of flight in Drosophila: not lost in translation",
#       10.7907/YYSN-7C82: thesis, not in the type vocabulary.
#   Items on the Janelia Reiser Lab publications page without Reiser as author (lab members' papers): Drummond N, Zhao A,
#     Borst A 2026 PLoS Comput Biol 10.1371/journal.pcbi.1014657 (and its preprint 10.1101/2025.11.15.688637); Liessem S et al.
#     2025 bioRxiv 10.64898/2025.12.13.693955; Shih MFM et al. 2019 G3 and Eliason J et al. 2018 G3; Longden KD 2018 and 2016
#     Curr Biol dispatches; Isaacson MD, Hedwig B 2017 Sci Rep; Ding Y et al. 2016 Nature; Dyakova O et al. 2015 Nat Commun.
#   No book chapters and no pre-2003 electrical-engineering papers by Michael B. Reiser were found in Crossref or ORCID.

